<!doctype html>
<html lang="da" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer">
<title>Timeregistrering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
:root{
  --bg:#F5F4F2;--surface:#FFFFFF;--ink:#262422;--muted:#716C66;--line:#E8E5E1;--line2:#D9D5CF;--soft:#F0EEEB;
  --accent:#DD7434;--accent-ink:#A9531D;--accent-bg:#FBF0E7;--accent-line:#F0CBAE;
  --navy-bg:#F1EEE9;--navy-line:#DCD5CB;
  --ok:#3D7A55;--ok-bg:#E8F1EA;--bad:#B0453A;--bad-bg:#FAEBE8;--pend:#716C66;--pend-bg:#F1EEE9;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.o{height:auto;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
ul{list-style:none;margin:0;padding:0}
svg{display:block;flex-shrink:0;stroke:currentColor}
.muted{color:var(--muted)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
body.o #app{flex:1 0 auto}

/* demo bar */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.demo-in{max-width:1320px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px}
.demo-in .lab{color:var(--muted);margin-right:auto}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{height:36px;border:0;background:transparent;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(38,36,34,.12)}
select,.inp,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 12px;height:42px}
.inp{width:100%}
textarea{width:100%;resize:vertical;height:auto;padding:10px 12px}
.plain{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* buttons, chips, pills */
.btn{height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#262422;font-weight:700}
.btn.big{height:52px;border-radius:14px;font-size:16px;width:100%}
.btn.full{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.okb{color:var(--ok);border-color:#BFD8C6} .btn.badb{color:var(--bad);border-color:#ECC3BB}
.icb{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-weight:600;font-size:15px}
.chip.sm{height:32px;padding:0 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-bg);border:2px solid var(--accent);color:var(--accent-ink);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.godkendt,.pill.matcher{background:var(--ok-bg);color:var(--ok)}
.pill.afventer{background:var(--pend-bg);color:var(--pend)}
.pill.afvist,.pill.afvigelse{background:var(--bad-bg);color:var(--bad)}
.pill.uplanlagt{background:var(--accent-bg);color:var(--accent-ink)}
.lbl{font-size:14px;font-weight:700;display:block}
.fld{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13.5px;color:var(--muted)} .hint.warn{color:var(--accent-ink);font-weight:600}
.err{color:var(--bad);font-size:14px;font-weight:600}
.info{font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px}
.empty{font-size:14px;color:var(--muted);padding:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.stepper button{width:50px;height:50px;border:0;border-radius:12px;background:var(--soft);font-size:26px;font-weight:700}
.stepper button.plus{background:var(--accent);color:#262422}
.stepper .v{display:flex;flex-direction:column;align-items:center;text-align:center}
.stepper output{font-size:34px;font-weight:700;line-height:1}
.stepper small{font-size:12.5px;color:var(--muted);margin-top:4px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#262422;display:flex;align-items:center;justify-content:center}

/* calendar shared */
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk span{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
i.godkendt{background:var(--ok)} i.afventer{background:#B3ACA2} i.afvist{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
.legend .sw{width:14px;height:14px;border-radius:4px;display:block}
.sw.reg{background:var(--navy-bg);border:1px solid var(--navy-line)} .sw.pln{border:2px dashed var(--accent)}
.sw.hol{background:repeating-linear-gradient(135deg,var(--soft) 0 3px,var(--surface) 3px 6px);border:1px solid var(--line2)}

/* ===== teacher phone ===== */
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:20px}
.phone{width:100%;max-width:400px;height:100%;max-height:844px;background:var(--bg);border:1px solid var(--line);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px -30px rgba(38,36,34,.35)}
@media (max-width:520px){.stage{padding:0}.phone{max-width:none;max-height:none;border:0;border-radius:0;box-shadow:none}}
.app-head{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.app-head .sub{font-size:13px;color:var(--muted)}
.app-head h1{font-size:24px;font-weight:700}
.app-body{flex:1;overflow:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.bnav{height:70px;border-top:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);position:relative;min-width:72px}
.bnav button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.bnav .pip{position:absolute;top:-4px;right:16px;background:var(--accent);color:#262422;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.alert{border-radius:16px;padding:12px 14px;background:var(--accent-bg);border:1px solid var(--accent-line);display:flex;flex-direction:column;gap:8px;font-size:14px}
.month{font-size:16px;font-weight:700}
.cday{height:52px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.cday .n{font-size:15px;font-weight:600;line-height:1.1}
.cday .l{font-size:10px;font-weight:700;color:var(--accent-ink);line-height:1.1}
.cday .l.pl{color:var(--muted);font-weight:500}
.cday.wkend{background:transparent}
.cday.today .n{color:var(--accent-ink)}
.cday.miss{border:1.5px dashed var(--accent);background:var(--accent-bg)}
.cday.hol{background:repeating-linear-gradient(135deg,var(--soft) 0 5px,var(--surface) 5px 10px)}
.cday.sel{border:2px solid var(--accent);background:var(--accent-bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel-h h2{font-size:18px;font-weight:700}
.panel-h p{font-size:14px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:15px;width:100%;text-align:left}
button.row:hover{border-color:var(--line2)}
.row .r{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.row .sub{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.row .sub.bad{color:var(--bad)} .row .sub.act{color:var(--accent-ink);font-weight:600}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:2px dashed var(--accent-line);border-radius:12px;background:var(--surface)}
.plan .k{font-size:12px;font-weight:700;color:var(--accent-ink)}
.plan p{font-size:15px}
.hero{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .nums{display:flex;gap:28px}
.hero .big{font-size:42px;font-weight:700;line-height:1}
.hero .cap{font-size:14px;color:var(--muted)}
.hero .split{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.hero .acc{font-size:14px;color:var(--accent-ink);font-weight:600}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}
.track .a{background:var(--accent)} .track .b{background:var(--accent-line)}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px}
.h16{font-size:16px}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.note-card .ico{width:32px;height:32px;border-radius:10px;background:var(--accent-bg);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.x2{border:0;background:var(--soft);border-radius:8px;width:28px;height:28px;font-size:16px;line-height:1}

/* login */
.lg-top{padding:36px 24px 52px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-bottom:1px solid var(--line)}
.lg-top .cap{font-size:14px;color:var(--muted);margin-top:10px}
.lg-top .ttl{font-size:26px;font-weight:700}
.lg-body{margin:-28px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px 24px;display:flex;flex-direction:column;gap:14px}
.lg-body h1{font-size:22px}
.lg-body .inp{height:50px;font-size:17px}
.login{overflow:auto}

/* ===== tidskalender (dag/uge) ===== */
.ctool{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctool .ttl{font-size:20px;font-weight:700;margin:0 4px}
.ctool .grow{flex:1}
.legend .sw.ok{background:var(--ok-bg);border:1.5px solid var(--ok)}
.legend .sw.pend{background:var(--navy-bg);border:1.5px solid var(--navy-line)}
.legend .sw.miss{background:var(--bad-bg);border:1.5px solid var(--bad)}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:calc(100vh - var(--demoh,57px) - 190px);min-height:420px}
.tc-in{min-width:calc(58px + var(--cols) * var(--cw))}
.tc-row{display:grid;grid-template-columns:58px repeat(var(--cols),minmax(var(--cw,140px),1fr))}
.tc-hd{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.tc-hd .h{padding:10px 10px 8px;border-left:1px solid var(--line);min-width:0}
.tc-hd .h b{display:flex;align-items:center;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-hd .h small{color:var(--muted);font-size:12.5px}
.tc-hd .h.today b{color:var(--accent-ink)}
.tc-hd .h.today{box-shadow:inset 0 -3px 0 var(--accent)}
.tc-hd .corner{border-left:0}
.tc-ad{border-bottom:1px solid var(--line);background:var(--bg)}
.tc-ad>div{border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:34px;min-width:0}
.tc-ad>div:first-child{border-left:0;font-size:11.5px;color:var(--muted);justify-content:center;padding-left:8px}
.tc-ad .tag{font-size:12px;font-weight:600;border-radius:7px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left}
.tc-ad .tag.hol{background:var(--soft);color:var(--muted)}
.tc-ad .tag.upl{background:var(--accent-bg);color:var(--accent-ink)}
.tc-times{position:relative}
.tc-times span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tc-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.tc-col.past{background-color:#FAF9F7}
.tc-col.wk{background-color:#FAF9F7}
.tc-col.holi{background-color:var(--soft)}
.slot{position:absolute;left:0;right:0;border:0;background:transparent;padding:0 8px;text-align:left;font-size:12px;font-weight:600;color:transparent;border-radius:6px}
.slot:hover,.slot:focus-visible{background:var(--accent-bg);color:var(--accent-ink)}
.blk{position:absolute;z-index:2;border-radius:9px;padding:4px 8px;text-align:left;font-size:12.5px;line-height:1.25;overflow:hidden;border:1.5px solid transparent;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 2px rgba(38,36,34,.08)}
.blk b{font-size:12px}
.blk .nt{font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.pln{background:#fff;border:1.5px dashed var(--accent);color:var(--accent-ink)}
.blk.afventer{background:var(--navy-bg);border-color:var(--navy-line);color:var(--ink)}
.blk.godkendt{background:var(--ok-bg);border-color:#BFD8C6;color:#2F6445}
.blk.miss,.blk.afvist{background:var(--bad-bg);border-color:#ECC3BB;color:var(--bad)}
.blk:hover{filter:brightness(.97)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600}

/* ===== office ===== */
.office{flex:1;display:flex;flex-wrap:wrap}
.sidewrap{flex:0 0 72px;position:relative;z-index:8}
.sidewrap.pin{flex-basis:240px}
.side{position:absolute;top:0;left:0;bottom:0;width:72px;background:var(--surface);border-right:1px solid var(--line);overflow:clip;transition:width .18s ease,box-shadow .18s ease}
.sidewrap:hover .side,.side:focus-within,.sidewrap.pin .side{width:240px}
.sidewrap:not(.pin):hover .side,.sidewrap:not(.pin) .side:focus-within{box-shadow:10px 0 28px rgba(38,36,34,.12)}
.side-in{position:sticky;top:var(--demoh,57px);height:calc(100vh - var(--demoh,57px));width:240px;padding:20px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;padding:0 9px 22px;white-space:nowrap}
.logo div{min-width:0} .logo b{font-size:15px;display:block} .logo span{font-size:13px;color:var(--muted)}
.side button{display:flex;justify-content:flex-start;align-items:center;gap:14px;padding:11px 13px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:500;text-align:left;white-space:nowrap}
.side button:hover{background:var(--soft)}
.side button[aria-current="page"]{background:var(--accent-bg);color:var(--accent-ink);font-weight:700}
.side .ic{position:relative;display:inline-flex;width:22px;justify-content:center}
.side .dot{position:absolute;top:-3px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transition:opacity .12s}
.side .badge{margin-left:auto;background:var(--accent);color:#262422;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.side .lb,.side .badge,.logo div{opacity:0;transition:opacity .12s}
.sidewrap:hover .lb,.sidewrap:hover .badge,.sidewrap:hover .logo div,.side:focus-within .lb,.side:focus-within .badge,.side:focus-within .logo div,.sidewrap.pin .lb,.sidewrap.pin .badge,.sidewrap.pin .logo div{opacity:1}
.sidewrap:hover .dot,.side:focus-within .dot,.sidewrap.pin .dot{opacity:0}
.side .pinb{margin-top:auto}
@media (max-width:860px){.sidewrap,.sidewrap.pin{flex-basis:100%}.side{position:static;width:auto!important;border-right:0;border-bottom:1px solid var(--line);box-shadow:none!important}.side-in{position:static;height:auto;width:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.side .lb,.side .badge{opacity:1}.side .ic,.side .pinb,.logo{display:none}.side button{gap:8px}}
.omain{flex:999 1 560px;min-width:0;padding:32px clamp(16px,4vw,44px) 48px;display:flex;flex-direction:column;gap:18px;max-width:1240px}
.ohead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.ohead .sub{font-size:14px;color:var(--muted)}
.ohead h1{font-size:30px;font-weight:700}
.pill.gst{background:#EEE9F3;color:#6B4E85}
.sheet>*{flex-shrink:0}
.wm{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:calc(100vh - var(--demoh,57px) - 190px)}
.wm table{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;table-layout:fixed}
.wm th,.wm td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;padding:6px;text-align:left;font-weight:400}
.wm thead th{position:sticky;top:0;z-index:3;background:var(--surface);padding:10px 8px}
.wm thead th b{display:block;font-size:14px;font-weight:700}
.wm thead th small{font-size:12px;color:var(--muted)}
.wm thead th.today{box-shadow:inset 0 -3px 0 var(--accent)} .wm thead th.today b{color:var(--accent-ink)}
.wm .nm{position:sticky;left:0;z-index:2;background:var(--surface);width:160px;border-left:0;padding:10px}
.wm thead .nm{z-index:4;font-size:12.5px;color:var(--muted);vertical-align:bottom}
.wm .nm .namelink{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;text-align:left}
.wm .nm .namelink i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.wm .nm small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.wm .nm .pill{margin:3px 0 0 16px;display:inline-block}
.wm td.c{position:relative;height:70px}
.wm td.c.past,.wm td.c.we{background:#FAF9F7}
.wm td.c.hol,.wm td.c.exp{background:var(--soft)}
.wm td.c.bkd{background:repeating-linear-gradient(135deg,#ECE9E4 0 6px,#FFFFFF 6px 12px)}
.wm .add{position:absolute;inset:0;width:100%;border:0;background:transparent;color:transparent;font-size:18px;font-weight:600;border-radius:0}
.wm .add:hover,.wm .add:focus-visible{background:var(--accent-bg);color:var(--accent-ink)}
.wm .ch,.wm .tg{position:relative;z-index:1;display:block;width:100%;text-align:left;border-radius:7px;padding:3px 6px;font-size:11.5px;line-height:1.3;margin-bottom:3px;border:1.5px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm .ch b{display:block;font-size:11.5px}

function tKal(I){
  const ps=ui.period,pe=periodEnd(ps);
  const miss=missingDays(I.id,ps,pe);
  let cells='';const lead=(pd(ps).getDay()+6)%7;
  for(let k=0;k<lead;k++)cells+='<span></span>';
  for(let s=ps;s<=pe;s=add(s,1)){
    const plan=S.schedule.filter(x=>x.inst===I.id&&x.date===s).reduce((a,x)=>a+x.count,0);
    const rs=S.regs.filter(r=>r.inst===I.id&&r.date===s);
    const reg=rs.filter(r=>r.status!=='afvist').reduce((a,r)=>a+r.count,0);
    const h=holidayOn(I.id,s);
    const bk=blockOn(I.id,s);
    const m=s<TODAY&&plan&&!rs.length&&!(h&&h.status==='godkendt');
    const cls=['cday',isWeekend(s)?'wkend':'',s===TODAY?'today':'',h?'hol':'',bk&&!plan?'bkd':'',bk&&plan?'hasab':'',availOn(I.id,s).length?'klar':'',m?'miss':'',s===ui.sel?'sel':''].join(' ');
    const l=bk&&!plan&&!rs.length?`<span class="l bkl">${esc(bk.reason)}</span>`:h?`<span class="l pl">${h.status==='godkendt'?'Ferie':'Ferie?'}</span>`:rs.length?`<span class="l">${reg} lek.</span>`:plan?`<span class="l pl">${plan} plan.</span>`:'';
    cells+=`<button class="${cls}" data-act="day" data-d="${s}" aria-label="${fmtLong(s)}${rs.length?', '+reg+' lektioner registreret':''}"><span class="n">${pd(s).getDate()}</span>${l}<span class="dots">${rs.map(r=>`<i class="${r.status}"></i>`).join('')}</span></button>`;
  }
  return `${miss.length?`<div class="alert"><p><b>Du mangler at registrere ${miss.length===1?'1 dag':miss.length+' dage'}</b></p><div class="chips">${miss.map(s=>`<button class="chip sm" data-act="day" data-d="${s}">${fmt(s)}</button>`).join('')}</div></div>`:''}

      <p class="month">${fmt(ps)} – ${fmt(pe)}${isLocked(ps)?' (låst)':''}</p>

    </div>
    ${dayPanel(I,ui.sel)}`;
}

    ${!rs.length&&!open.length&&!h?'<p class="empty">Intet planlagt eller registreret.</p>':''}
    ${L?'':future?`<button class="btn pri big" data-act="addreg">+ Planlæg lektion</button><p class="hint">Lektioner frem i tiden lægges i kalenderen, så kontoret kan se, at du er optaget. Tryk "Udført", når de er kørt.</p>`:`<button class="btn pri big" data-act="addreg">+ Tilføj lektioner</button>`}

function tOver(I){

  const left=Math.max(0,Math.round((pd(pe)-pd(TODAY))/864e5));
  const by={};regs.filter(r=>r.status!=='afvist').forEach(r=>{by[r.cat]=by[r.cat]||{a:0,b:0};by[r.cat][r.status==='godkendt'?'a':'b']+=r.count});

  return '';
}
function csv(){
  const ps=ui.period,pe=periodEnd(ps);const out=['Medarbejdernr;Navn;Løndel;Tekst;Antal;Sats;Beløb'];
  S.instructors.filter(I=>!isGuest(I)).forEach(I=>{const by={};S.regs.filter(r=>r.inst===I.id&&r.status==='godkendt'&&r.date>=ps&&r.date<=pe).forEach(r=>{const k=(r.yd||r.cat)+'|'+priceFor(r);by[k]=by[k]||{r,n:0};by[k].n+=r.count});
    Object.values(by).forEach(({r,n})=>{const y=yd(r.yd),sx=y&&sats(y.sats),p=priceFor(r);out.push([I.nr,I.name,sx?sx.ld:(LOENDEL[r.cat]||''),ydName(r),n,p.toFixed(2).replace('.',','),(n*p).toFixed(2).replace('.',',')].join(';'))})});
  return out.join('\n');
}
